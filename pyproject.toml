[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexos-promptothon"
version = "0.1.0"
description = "Adaptive verified Luna-first cognitive orchestration for Promptothon 2026"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Francisco Angulo de Lafuente"}]
dependencies = []

[project.optional-dependencies]
demo = ["gradio>=5.0,<7"]
dev = ["pytest>=8"]

[project.scripts]
reflexos-benchmark = "reflexos.benchmark:main"
reflexos = "reflexos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
